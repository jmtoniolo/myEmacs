set -g mouse on
unbind -n MouseDown3Pane

set -g status-bg cyan
set -g window-status-style bg="#32a88d",fg=black
set -g window-status-current-style bg=pink,fg=black

set -g pane-border-style fg=magenta
set -g pane-active-border-style "bg=default fg=magenta"

set -g status-left ""

set-window-option -g window-status-current-format "#I:#W<<<"
set-window-option -g window-status-last-style "bg="#fac3e7

# Use emacs keybindings in copy mode
set -g mode-keys emacs

# Use emacs keybindings in the status line / command prompt
set -g status-keys emacs

# Allow terminal selection with Shift+Mouse
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"

# Set M-m as the 
unbind C-b
set -g prefix M-m
bind -n M-m send-prefix
